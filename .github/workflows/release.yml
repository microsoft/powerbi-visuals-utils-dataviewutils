name: release

on:
  release:
    types: [created]

jobs:
  build:
    environment: automated-release
    runs-on: ubuntu-latest
    env: 
      GH_TOKEN: ${{secrets.GH_TOKEN}}
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - name: Add config details
      run: |
        git config --global user.name ${{secrets.NAME}}
        git config --global user.email ${{secrets.EMAIL}}
    - name: Move release to draft
      run: gh release edit $TAG_NAME --draft=true
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
    - name: Run npm install, build and test
      run: |
        npm ci
        npm run build
        npm test
    - run: zip -r release.zip lib *.md LICENSE package.json package-lock.json -x 'lib/src/*' 'lib/test/*'
    - name: Upload production artifacts
      run: |
        gh release upload $TAG_NAME "release.zip#release"
        gh release edit $TAG_NAME --draft=false
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}