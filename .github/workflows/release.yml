name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    environment: automated-release
    runs-on: ubuntu-latest

    env: 
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Move release to draft
        run: gh release edit "$TAG_NAME" --draft=true
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Create release archive
        run: |
          zip -r lib.zip lib *.md LICENSE package.json package-lock.json -x 'lib/src/*' 'lib/test/*'

      - name: Upload production artifacts
        run: |
          gh release upload $TAG_NAME "lib.zip"
          gh release edit $TAG_NAME --draft=false
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}